<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>hokichi 耕作放棄地マップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>hokichi <span>耕作放棄地マップ</span></h1>
      <p class="sub">eMAFF農地ナビの公表情報（遊休農地）を自然栽培向けに採点して表示。<b>氏名は載らない</b>。地番から登記で確認する。</p>
    </header>

    <section class="ctl">
      <label>市町村
        <select id="city"><option value="">— 県全体（件数のみ） —</option></select>
      </label>
      <label>最低点数 <output id="minScoreOut">60</output>
        <input id="minScore" type="range" min="0" max="120" step="5" value="60">
      </label>
      <div class="row">
        <label class="chk"><input id="lendOnly" type="checkbox"> 貸付意向のみ</label>
        <label class="chk"><input id="hideUnknown" type="checkbox"> 所有者不明を除く</label>
      </div>
      <div class="row">
        <label class="chk"><input id="showFude" type="checkbox" checked> 周辺の区画（筆ポリゴン）を表示</label>
      </div>
      <div class="row">
        <label>地目
          <select id="landuse"><option value="">すべて</option><option>畑</option><option>田</option><option>樹園地</option></select>
        </label>
        <label>背景
          <select id="basemap"><option value="pale">淡色地図</option><option value="std">標準地図</option><option value="photo">航空写真</option></select>
        </label>
      </div>
    </section>

    <section id="summary" class="summary"></section>

    <section id="list" class="list"></section>

    <section id="detail" class="detail hidden"></section>

    <footer>
      <button id="cartBtn" class="btn">登記請求リスト <span id="cartCount" class="badge">0</span></button>
      <p id="attrib" class="attrib"></p>
    </footer>
  </aside>

  <main id="map"></main>

  <div id="cart" class="modal hidden">
    <div class="modal-body">
      <h2>登記請求リスト</h2>
      <p class="sub">登記情報提供サービス（全部事項 330円/筆）で請求する地番。ブラウザ内にだけ保存される。</p>
      <table id="cartTable"><thead><tr><th>市町村</th><th>大字・字</th><th>地番</th><th>地目</th><th>㎡</th><th>点</th><th></th></tr></thead><tbody></tbody></table>
      <div class="row">
        <button id="cartCsv" class="btn">CSV書出</button>
        <button id="cartLetter" class="btn">農業委員会 照会文をコピー</button>
        <button id="cartClear" class="btn danger">全消去</button>
        <button id="cartClose" class="btn">閉じる</button>
      </div>
      <pre id="letterOut" class="hidden"></pre>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
