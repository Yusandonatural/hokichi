name: build-and-deploy

# 手動実行、または毎月1日 03:00 JST（筆ポリゴンの更新は年1回だが、eMAFF CSV を差し替えたら手動で回す）
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Cloudflare にデプロイする"
        type: boolean
        default: true
  schedule:
    - cron: "0 18 1 * *"   # UTC 18:00 = JST 03:00
  push:
    branches: [main]
    paths: ["data/emaff/**", "pipeline/**", "web/**", "worker/**", "wrangler.toml", "tools/hokichi.py"]

permissions:
  contents: read

env:
  PREF_CODE: "29"        # 奈良県
  FUDE_YEAR: "2025"
  FUDE_RCOM_YEAR: "2020"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: 筆ポリゴンをキャッシュから復元
        id: fude-cache
        uses: actions/cache/restore@v4
        with:
          path: data/fude
          key: fude-v2-${{ env.PREF_CODE }}-${{ env.FUDE_YEAR }}-${{ env.FUDE_RCOM_YEAR }}

      - name: 筆ポリゴンを取得（農林水産省）
        if: steps.fude-cache.outputs.cache-hit != 'true'
        run: python3 pipeline/fetch_fude.py --pref "$PREF_CODE" --year "$FUDE_YEAR" --rcom-year "$FUDE_RCOM_YEAR" --out data/fude

      - name: 筆ポリゴンをキャッシュに保存（取得できた時だけ）
        if: steps.fude-cache.outputs.cache-hit != 'true' && hashFiles('data/fude/*.fgb', 'data/fude/*.geojson') != ''
        uses: actions/cache/save@v4
        with:
          path: data/fude
          key: fude-v2-${{ env.PREF_CODE }}-${{ env.FUDE_YEAR }}-${{ env.FUDE_RCOM_YEAR }}

      - name: eMAFF CSV の有無を確認
        id: emaff
        run: |
          n=$(ls data/emaff/*.csv data/emaff/*.geojson data/emaff/*.json 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then
            echo "::warning::data/emaff/ に eMAFF農地ナビのデータ（CSV/GeoJSON）がありません。サンプルデータでビルドします。"
          fi

      - name: 地図データをビルド
        run: |
          src=data/emaff
          [ "${{ steps.emaff.outputs.count }}" = "0" ] && src=data/sample
          python3 pipeline/build_web_data.py --emaff "$src" --fude data/fude --config data/config.json --fude-year "$FUDE_YEAR" --out web/data

      - uses: actions/upload-artifact@v4
        with:
          name: web-data
          path: web/data
          retention-days: 30

      - name: Cloudflare Workers にデプロイ
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deploy) && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
