name: pages-preview

# GitHub Pages への公開（プレビュー用）。利用者が明示的に選択したもの。
# 注意: GitHub Pages は URL を知っていれば誰でも見られる。
#       社内限定の本番は Cloudflare Workers（build-and-deploy.yml）。
#       data/emaff/ に実データを置く前はサンプルだけが載る。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "pipeline/**", "data/**", "tools/hokichi.py", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREF_CODE: "29"
  FUDE_YEAR: "2025"
  FUDE_RCOM_YEAR: "2020"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: 筆ポリゴンをキャッシュから復元
        id: fude-cache
        uses: actions/cache/restore@v4
        with:
          path: data/fude
          key: fude-v2-${{ env.PREF_CODE }}-${{ env.FUDE_YEAR }}-${{ env.FUDE_RCOM_YEAR }}

      - name: 筆ポリゴンを取得（農林水産省）
        if: steps.fude-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 pipeline/fetch_fude.py --pref "$PREF_CODE" --year "$FUDE_YEAR" --rcom-year "$FUDE_RCOM_YEAR" --out data/fude

      - name: 筆ポリゴンをキャッシュに保存（取得できた時だけ）
        if: steps.fude-cache.outputs.cache-hit != 'true' && hashFiles('data/fude/*.fgb', 'data/fude/*.geojson') != ''
        uses: actions/cache/save@v4
        with:
          path: data/fude
          key: fude-v2-${{ env.PREF_CODE }}-${{ env.FUDE_YEAR }}-${{ env.FUDE_RCOM_YEAR }}

      - name: 地図データをビルド（CSVが無ければサンプル）
        run: |
          src=data/emaff
          if [ "$(ls data/emaff/*.csv data/emaff/*.geojson data/emaff/*.json 2>/dev/null | wc -l)" = "0" ]; then
            src=data/sample
            echo "::warning::eMAFF農地ナビのデータ（CSV/GeoJSON）が無いのでサンプルデータでビルドします"
          fi
          python3 pipeline/build_web_data.py --emaff "$src" --fude data/fude --config data/config.json --fude-year "$FUDE_YEAR" --out web/data

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
